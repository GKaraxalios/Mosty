  /** Absolute URL for product image (Magento often returns /media/... or //cdn/...). */
  resolveProductImageUrl(href) {
    if (!href || typeof href !== 'string') return null;
    const u = href.trim();
    if (!u) return null;
    if (u.startsWith('http://') || u.startsWith('https://')) return u;
    if (u.startsWith('//')) return (typeof window !== 'undefined' ? window.location.protocol : 'https:') + u;
    const env = (typeof window !== 'undefined' && window.__MOSTY_BOOTSTRAP__ && window.__MOSTY_BOOTSTRAP__.env) || {};
    const base = (env.storePublicOrigin || '').replace(/\/$/, '');
    if (u.startsWith('/') && base) return base + u;
    return null;
  }

  visualProductCard(p, i) {
    const href = p.url || '#';
    const priceDisplay = p.price ? `${p.price}` : '';
    const currency = p.currency || 'EUR';
    const imgSrc = this.resolveProductImageUrl(p.image);
    const hasImage = !!imgSrc;
    const hue = PRODUCT_HUES[i % PRODUCT_HUES.length];
    const initial = (p.name || '?')[0].toUpperCase();

    const g1 = 18 + (hue % 10);
    const g2 = 9 + (hue % 6);
    const imgBlock = hasImage
      ? `<img src="${this.esc(imgSrc)}" alt="${this.esc(p.name)}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'product-img-placeholder\\' style=\\'background:linear-gradient(135deg,hsl(0,0%,${g1}%),hsl(0,0%,${g2}%));color:hsl(0,0%,42%)\\'>${initial}</div>'">`
      : `<div class="product-img-placeholder" style="background:linear-gradient(135deg,hsl(0,0%,${g1}%),hsl(0,0%,${g2}%));color:hsl(0,0%,42%)">${initial}</div>`;

    const usePopularity = !!(p.popularity_reason || p.badge);
    const rawStyling = usePopularity ? (p.popularity_reason || '') : (p.styling_reason ?? p.product_styling ?? p.short_reason ?? p.ai_explanation ?? '');
    const normalizedStyling = normalizeStyling(rawStyling);
    const finalStyling = normalizedStyling || (usePopularity ? '' : stylingFallback(i));
    if (typeof console !== 'undefined' && console.debug) {
      console.debug('[product-card]', { sku: p.sku, name: p.name, usePopularity, raw: rawStyling?.slice(0, 60) || '(empty)', final: finalStyling?.slice(0, 60) });
    }
    const stylingHtml = finalStyling ? `<p class="product-styling">${this.esc(finalStyling)}</p>` : '';

    const reasoning = p.reasoning || {};
    const shortReason = reasoning.short_reason || '';
    const reasonHtml = shortReason
      ? `<p class="product-reason">${this.esc(shortReason)}</p>`
      : '';

    const score = typeof p.score === 'number' ? Math.round(p.score * 100) : null;
    const scoreHtml = (score != null && !Number.isNaN(score))
      ? `<div class="product-score-row"><span class="product-score">${score}% match</span></div>`
      : '';

    const badgeLabel = p.badge ? this.esc(p.badge) : this.esc(p.availability || this.str('inStock', 'In stock'));
    const badgeClass = p.badge ? 'product-badge product-badge--popular' : 'product-badge';

    return `
      <a class="product-card" href="${href}" target="_blank" rel="noopener" style="flex:0 0 calc(33.333% - 16px);max-width:calc(33.333% - 16px);scroll-snap-align:start;">
        <div class="product-img-wrap">
          ${imgBlock}
          <span class="${badgeClass}">${badgeLabel}</span>
        </div>
        <div class="product-info">
          <h4>${this.esc(p.name)}</h4>
          ${scoreHtml}
          ${priceDisplay ? `<div class="product-price-row"><span class="product-price">${priceDisplay}</span><span class="product-currency">${currency}</span></div>` : ''}
          ${stylingHtml}
          ${reasonHtml}
        </div>
        <div class="product-cta">
          <span>${this.esc(this.str('viewProduct', 'View Product'))}</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
        </div>
      </a>
    `;
  }

  initSourcesSlider(sourcesEl) {
    const slider = sourcesEl.querySelector('.sources-slider');
    if (!slider) return;
    const viewport = slider.querySelector('.sources-slider-viewport');
    const track = slider.querySelector('.sources-slider-track');
    const prevBtn = slider.querySelector('.sources-slider-prev');
    const nextBtn = slider.querySelector('.sources-slider-next');
    const dotsEl = slider.querySelector('.sources-dots');
    if (!viewport || !track || !prevBtn || !nextBtn) return;

    function updateState() {
      const scrollLeft = track.scrollLeft;
      const maxScroll = track.scrollWidth - track.clientWidth;
      prevBtn.disabled = maxScroll <= 0 || scrollLeft <= 1;
      nextBtn.disabled = maxScroll <= 0 || scrollLeft >= maxScroll - 1;
      const dots = dotsEl.querySelectorAll('.sources-dot');
      if (dots.length) {
        const pageIndex = maxScroll <= 0 ? 0 : Math.round(scrollLeft / track.clientWidth);
        dots.forEach((d, i) => {
          const active = i === Math.min(pageIndex, dots.length - 1);
          d.classList.toggle('active', active);
          d.setAttribute('aria-selected', active);
        });
      }
    }

    function buildDots() {
      dotsEl.innerHTML = '';
      const viewportW = viewport.clientWidth;
      const scrollW = track.scrollWidth;
      if (viewportW <= 0 || scrollW <= viewportW) return;
      const pageCount = Math.ceil(scrollW / viewportW);
      for (let i = 0; i < pageCount; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sources-dot' + (i === 0 ? ' active' : '');
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-label', `Page ${i + 1} of ${pageCount}`);
        btn.setAttribute('aria-selected', i === 0);
        btn.addEventListener('click', () => {
          const scrollTo = Math.min(i * viewportW, scrollW - viewportW);
          track.scrollTo({ left: scrollTo, behavior: 'smooth' });
        });
        dotsEl.appendChild(btn);
      }
    }

    prevBtn.addEventListener('click', () => {
      track.scrollBy({ left: -(track.clientWidth + 8), behavior: 'smooth' });
    });
    nextBtn.addEventListener('click', () => {
      track.scrollBy({ left: track.clientWidth + 8, behavior: 'smooth' });
    });
    track.addEventListener('scroll', () => { requestAnimationFrame(updateState); });
    window.addEventListener('resize', () => { requestAnimationFrame(updateState); });

    requestAnimationFrame(() => {
      updateState();
      buildDots();
      updateState();
    });
  }

  productCard(s, i) {
    const hue = PRODUCT_HUES[i % PRODUCT_HUES.length];
    const initial = (s.name || '?')[0].toUpperCase();
    const score = Math.round((s.score || 0) * 100);
    const href = s.url || '#';
    return `
      <a class="product-card" href="${href}" target="_blank" rel="noopener" style="flex-direction:row;gap:12px;padding:12px 14px">
        <div style="width:48px;height:48px;border-radius:var(--r-sm);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:linear-gradient(135deg,hsl(0,0%,${22 + (hue % 8)}%),hsl(0,0%,${11 + (hue % 5)}%));color:hsl(0,0%,48%)">
          <span>${this.esc(initial)}</span>
        </div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <h4 style="font-size:12.5px;font-weight:500;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${this.esc(s.name)}</h4>
          <span style="font-size:10.5px;color:var(--text-faint);font-weight:500">${this.esc(s.sku)}</span>
          <div style="display:flex;align-items:center;gap:6px;margin-top:2px">
            ${score ? `<span class="product-score">${score}%</span>` : ''}
            <span style="font-size:11px;color:var(--text-faint);margin-left:auto">View &nearr;</span>
          </div>
        </div>
      </a>
    `;
  }

  showThinking() {
    this.dom.chatInner.querySelector('.thinking')?.remove();
    const div = document.createElement('div');
    div.className = 'thinking';
    const think = this.str('thinking', 'Thinking...');
    div.innerHTML = `
      <div class="msg-ava msg-ava--ai">${elizaAssistantAvatarHtml}</div>
      <div class="thinking-body">
        <div class="thinking-dots"><span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span></div>
        <span class="thinking-label">${this.esc(think)}</span>
      </div>
    `;
    this.dom.chatInner.appendChild(div);
    this.scroll();
  }

  hideThinking() { this.dom.chatInner.querySelector('.thinking')?.remove(); }

  async typeWriter(el, markdown) {
    const words = markdown.split(/(\s+)/);
    let buf = '';
    for (let i = 0; i < words.length; i++) {
      buf += words[i];
      if (i % 2 === 0) {
        el.innerHTML = this.md(buf) + '<span class="msg-cursor"></span>';
        this.scroll();
        const w = words[i];
        let d = 14 + Math.random() * 12;
        if (/[.!;]$/.test(w)) d = 50 + Math.random() * 40;
        else if (/[,:]$/.test(w)) d = 25 + Math.random() * 20;
        await this.sleep(d);
      }
    }
    el.innerHTML = this.md(markdown);
  }

  md(text) {
    if (!text) return '';
    try {
      return DOMPurify.sanitize(marked.parse(text, { breaks: true, gfm: true }), {
        ADD_ATTR: ['target'],
        ALLOWED_TAGS: ['p','br','strong','em','del','ul','ol','li','a','code','pre','h1','h2','h3','h4','h5','h6','blockquote','table','thead','tbody','tr','th','td','hr','img','span','div','sup','sub'],
      });
    } catch { return this.esc(text); }
  }

  persist() {
    if (this.isSharedMode) return;
    const conv = this.getActiveConversation();
    if (!conv) return;
    conv.messages = [...this.messages];
    conv.updated_at = new Date().toISOString();
    if (this.messages.length === 1 && this.messages[0].role === 'user') conv.title = this.messages[0].content.substring(0, 60);
    this.saveConversations();
    this.renderSidebar();
  }

  showWelcome() {
    if (this.isSharedMode) {
      this.dom.chatInner.innerHTML = '';
      return;
    }
    const wel = this.schema.welcome || {};
    const title = wel.title || 'ELIZA AI AGENT';
    const sub = wel.subtitle || '';
    const suggestions = Array.isArray(wel.suggestions) ? wel.suggestions : [];
    const sugHtml = suggestions.map((s) => `
      <button class="sug-card" data-query="${this.esc(s.query || '')}">
        <span class="sug-title">${this.esc(s.title || '')}</span>
        <span class="sug-sub">${this.esc(s.subtitle || '')}</span>
      </button>
    `).join('');
    this.dom.chatInner.innerHTML = '';
    const w = document.createElement('div');
    w.className = 'welcome';
    w.id = 'welcomeScreen';
    w.innerHTML = `
      <div class="welcome-glow"><div class="icon-circle">${elizaAssistantAvatarHtml}</div></div>
      <h2>${this.esc(title)}</h2>
      <p>${this.esc(sub)}</p>
      <div class="sug-grid">${sugHtml}</div>
      <div class="chip-row" id="welcomeChipRow"></div>
    `;
    this.dom.chatInner.appendChild(w);
    w.querySelectorAll('.sug-card').forEach((c) => {
      c.addEventListener('click', () => { this.dom.chatInput.value = c.dataset.query; this.dom.sendBtn.classList.add('active'); this.handleSend(); });
    });
    const chipRow = w.querySelector('#welcomeChipRow');
    const qf = Array.isArray(wel.quickFilters) ? wel.quickFilters : [];
    if (chipRow) {
      qf.forEach((c) => {
        const btn = document.createElement('button');
        btn.className = 'chip-btn';
        btn.type = 'button';
        btn.textContent = c.label || '';
        const fj = JSON.stringify(c.filters || {});
        btn.setAttribute('data-filters-json', fj);
        btn.addEventListener('click', () => this.applyQuickFilter(c.filters || {}));
        chipRow.appendChild(btn);
      });
    }
    this.updateWelcomeChipsActive();
  }

  hideWelcome() { this.dom.chatInner.querySelector('.welcome')?.remove(); }

  applySharedMode() {
    document.body.classList.add('mode-shared');
    if (this.isSharedReadonly) {
      document.body.classList.add('mode-shared-readonly');
      this.dom.chatInput.setAttribute('disabled', 'disabled');
      this.dom.sendBtn.setAttribute('disabled', 'disabled');
    } else {
      this.dom.chatInput.removeAttribute('disabled');
      this.dom.sendBtn.removeAttribute('disabled');
    }
  }

  renderSharedBanner() {
    const existing = this.dom.chatInner.querySelector('.shared-banner');
    if (existing) existing.remove();
    const banner = document.createElement('div');
    banner.className = 'shared-banner';
    banner.innerHTML = this.isSharedReadonly
      ? '<strong>Shared conversation</strong><span>&middot; Read-only view &middot; Anyone with this link can view this conversation</span>'
      : '<strong>Shared conversation</strong><span>&middot; Live shared thread &middot; Messages continue in this same conversation</span>';
    this.dom.chatInner.prepend(banner);
  }

  async initSharedThread() {
    if (!this.sharedToken || this.sharedToken.startsWith('__')) {
      this.dom.chatInner.innerHTML = '<div class="shared-banner">This shared conversation is unavailable.</div>';
      return;
    }
    this.dom.chatInner.innerHTML = '';
    this.renderSharedBanner();
    try {
      const data = await this.api(this.apiPath('sharedRead', { token: this.sharedToken }));
      const conv = data.conversation || {};
      const msgs = Array.isArray(conv.messages) ? conv.messages : [];
      const title = conv.title || 'Shared conversation';
      const h = this.$('.header-center h1');
      if (h) h.textContent = title;
      this.conversations = [{
        id: 'shared',
        session_id: null,
        title,
        shared: true,
        messages: msgs,
        created_at: conv.created_at || new Date().toISOString(),
        updated_at: conv.updated_at || new Date().toISOString(),
      }];
      this.activeConversationId = 'shared';
      this.messages = msgs.map((m) => ({
        role: m.role,
        content: m.content || '',
        timestamp: m.timestamp || '',
        sources: Array.isArray(m.sources) ? m.sources : [],
        products: Array.isArray(m.products) ? m.products : [],
        intent: m.intent || null,
      }));
      this.renderSidebar();
      this.renderAll();
      this.renderSharedBanner();
    } catch (_) {
      this.dom.chatInner.innerHTML = '<div class="shared-banner">This shared conversation is no longer available.</div>';
      if (!this.isSharedReadonly) {
        this.dom.chatInput.setAttribute('disabled', 'disabled');
        this.dom.sendBtn.setAttribute('disabled', 'disabled');
      }
    }
  }

  async bootstrapFromUrlSession() {
    if (this.isSharedMode) return;
    const params = new URLSearchParams(window.location.search);
    const urlSessionId = params.get('session_id');
    if (!urlSessionId) return;
    try {
      const data = await this.api(this.apiPath('sessionGet', { sessionId: urlSessionId }));
      const sess = data.session || {};
      const history = Array.isArray(sess.conversation_history) ? sess.conversation_history : [];
      const imported = history.map((m) => {
        const base = { role: m.role, content: m.content || '', timestamp: m.timestamp || '' };
        if (m.role === 'assistant') {
          const parsed = this.decodeAssistantEnvelope(base.content);
          if (parsed) {
            return {
              ...base,
              content: parsed.content,
              sources: parsed.sources,
              products: parsed.products,
              intent: parsed.intent,
              location: parsed.location || null,
            };
          }
        }
        return base;
      });
      let conv = this.conversations.find((c) => c.session_id === urlSessionId);
      if (!conv) {
        conv = {
          id: 'c_' + Date.now(),
          session_id: urlSessionId,
          title: (history.find((m) => m.role === 'user')?.content || 'Shared continuation').slice(0, 60),
          shared: false,
          messages: [],
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        };
        this.conversations.unshift(conv);
      }
      conv.messages = imported;
      conv.updated_at = new Date().toISOString();
      this.activeConversationId = conv.id;
      this.sessionId = urlSessionId;
      this.messages = imported;
      this.saveConversations();
      this.renderSidebar();
      this.renderAll();
      if (params.get('continued_from_shared') === '1') {
        this.showToast('You are continuing a shared conversation');
      }
      this.hideWelcome();
    } catch (_) {
      this.showToast('Failed to load session from URL');
    }
  }

  scroll() { requestAnimationFrame(() => { this.dom.chatScroll.scrollTop = this.dom.chatScroll.scrollHeight; }); }

  autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 150) + 'px'; }

  async copyMsg(btn, text) {
    try {
      await navigator.clipboard.writeText(text);
      btn.classList.add('copied');
      btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      }, 2000);
    } catch { this.showToast(this.str('failedCopy', 'Failed to copy')); }
  }

  async openShare(conversationId) {
    const conv = this.conversations.find((c) => c.id === conversationId);
    if (!conv || !conv.session_id) {
      this.showToast('Send at least one message before sharing.');
      return;
    }
    this.shareSessionId = conv.session_id;
    this.shareUrl = '';
    this.renderShareModalState({
      state: 'loading',
      title: 'Checking sharing status',
      desc: 'Please wait while we check whether this conversation is already shared.',
      url: '',
    });
    this.dom.shareModal.classList.add('open');
    try {
      const status = await this.api(this.apiPath('shareStatus', { sessionId: conv.session_id }));
      if (status.is_shared) {
        conv.shared = true;
        this.renderShareModalState({
          state: 'active',
          title: 'Sharing is active',
          desc: this.shareUrl
            ? 'This link is live. Anyone with it can open this conversation.'
            : 'A shared link is active. Create a new link to get a copyable URL.',
          url: this.shareUrl || '',
        });
      } else {
        conv.shared = false;
        this.renderShareModalState({
          state: 'idle',
          title: 'This conversation is private',
          desc: 'Create a public link to share this conversation.',
          url: '',
        });
      }
      this.renderSidebar();
    } catch (e) {
      this.renderShareModalState({
        state: 'error',
        title: 'Unable to load sharing status',
        desc: 'Try again in a moment.',
        error: e.message || 'Unexpected error',
        url: '',
      });
    }
  }

  closeShare() {
    this.dom.shareModal.classList.remove('open');
  }

  renderShareModalState({ state, title, desc, url, error, copied } = {}) {
    const pill = this.dom.shareStatePill;
    pill.classList.remove('is-active', 'is-loading', 'is-disabled', 'is-error');
    const setPill = (label, cls) => {
      pill.textContent = label;
      if (cls) pill.classList.add(cls);
    };
    if (state === 'loading') setPill('Loading', 'is-loading');
    else if (state === 'active') setPill('Sharing active', 'is-active');
    else if (state === 'disabled') setPill('Sharing disabled', 'is-disabled');
    else if (state === 'error') setPill('Error', 'is-error');
    else setPill('Not shared', '');

    this.dom.shareStateTitle.textContent = title || '';
    this.dom.shareStatusText.textContent = desc || '';
    this.dom.shareUrlInput.value = url || '';
    this.dom.shareUrlInput.placeholder = url ? '' : 'No active link yet';
    this.dom.shareErrorText.style.display = error ? 'block' : 'none';
    this.dom.shareErrorText.textContent = error || '';
    this.dom.shareReplaceHint.style.display = (state === 'active' || state === 'loading') ? 'block' : 'none';

    const loading = state === 'loading' || state === 'creating' || state === 'regenerating' || state === 'disabling';
    this.dom.copyShareBtn.disabled = loading || !url;
    this.dom.revokeShareBtn.disabled = loading || state !== 'active';
    this.dom.createShareBtn.disabled = loading;

    if (state === 'active') {
      this.dom.createShareBtn.textContent = 'Create new link';
    } else if (state === 'loading') {
      this.dom.createShareBtn.textContent = 'Please wait...';
    } else if (state === 'disabling') {
      this.dom.createShareBtn.textContent = 'Updating...';
    } else if (state === 'error') {
      this.dom.createShareBtn.textContent = 'Try again';
    } else {
      this.dom.createShareBtn.textContent = 'Create link';
    }
    this.dom.copyShareBtn.textContent = copied ? 'Copied' : 'Copy';
  }

  async createShareLink() {
    if (!this.shareSessionId) return;
    const hasExisting = !!this.shareUrl;
    this.renderShareModalState({
      state: hasExisting ? 'regenerating' : 'creating',
      title: hasExisting ? 'Replacing active link' : 'Creating share link',
      desc: hasExisting
        ? 'A new link is being created. The previous link will stop working.'
        : 'Generating a public link for this conversation.',
      url: this.shareUrl || '',
    });
    try {
      const res = await this.api(this.apiPath('shareCreate', { sessionId: this.shareSessionId }), {
        method: 'POST',
        body: JSON.stringify({})
      });
      this.shareUrl = res.share_url || '';
      this.renderShareModalState({
        state: 'active',
        title: 'Sharing is active',
        desc: 'Anyone with this link can open this conversation.',
        url: this.shareUrl,
      });
      const conv = this.conversations.find((c) => c.session_id === this.shareSessionId);
      if (conv) conv.shared = true;
      this.renderSidebar();
      this.showToast('Share link is ready');
    } catch (e) {
      this.renderShareModalState({
        state: 'error',
        title: 'Could not create link',
        desc: 'Please try again.',
        error: e.message || 'Unexpected error',
        url: this.shareUrl || '',
      });
    }
  }

  async copyShareLink() {
    if (!this.shareUrl) return;
    try {
      await navigator.clipboard.writeText(this.shareUrl);
      this.renderShareModalState({
        state: 'active',
        title: 'Sharing is active',
        desc: 'Anyone with this link can open this conversation.',
        url: this.shareUrl,
        copied: true,
      });
      setTimeout(() => {
        this.renderShareModalState({
          state: 'active',
          title: 'Sharing is active',
          desc: 'Anyone with this link can open this conversation.',
          url: this.shareUrl,
        });
      }, 1400);
      this.showToast('Link copied');
    } catch (e) {
      this.renderShareModalState({
        state: 'error',
        title: 'Copy failed',
        desc: 'You can still copy the link manually.',
        error: e.message || 'Clipboard access was blocked',
        url: this.shareUrl,
      });
      this.showToast('Failed to copy link');
    }
  }

  async revokeShareLink() {
    if (!this.shareSessionId) return;
    this.renderShareModalState({
      state: 'disabling',
      title: 'Disabling sharing',
      desc: 'The current link will stop working immediately.',
      url: this.shareUrl || '',
    });
    try {
      await this.api(this.apiPath('shareDelete', { sessionId: this.shareSessionId }), { method: 'DELETE' });
      this.shareUrl = '';
      this.renderShareModalState({
        state: 'disabled',
        title: 'Sharing is disabled',
        desc: 'This conversation is private again. You can create a new link anytime.',
        url: '',
      });
      const conv = this.conversations.find((c) => c.session_id === this.shareSessionId);
      if (conv) conv.shared = false;
      this.renderSidebar();
      this.showToast('Sharing disabled');
    } catch (e) {
      this.renderShareModalState({
        state: 'error',
        title: 'Could not disable sharing',
        desc: 'Please try again.',
        error: e.message || 'Unexpected error',
        url: this.shareUrl || '',
      });
    }
  }

  openSettings() { this.dom.apiKeyInput.value = this.apiKey; this.dom.langSelect.value = this.language; this.dom.settingsModal.classList.add('open'); }
  closeSettings() { this.dom.settingsModal.classList.remove('open'); }

  showToast(t) { this.dom.toast.textContent = t; this.dom.toast.classList.add('show'); setTimeout(() => this.dom.toast.classList.remove('show'), 2500); }

  esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
}

document.addEventListener('DOMContentLoaded', async () => {
  const root = document.getElementById('app-root');
  let schema;
  try {
    schema = await renderChatPage(root, {});
  } catch (e) {
    console.error(e);
    schema = null;
    if (root) root.innerHTML = '<p style="padding:24px;color:#000;font-family:system-ui">Failed to load chat UI schema.</p>';
    return;
  }
  const mode = CHAT_MODE && !CHAT_MODE.startsWith('__') ? CHAT_MODE : 'interactive';
  const sharedToken = SHARED_TOKEN && !SHARED_TOKEN.startsWith('__') ? SHARED_TOKEN : '';
  window.mostyChat = new MostyChat(schema, { mode, sharedToken });
  if (mode === 'interactive') {
    await window.mostyChat.bootstrapFromUrlSession();
    if (navigator.onLine) await window.mostyChat.flushOfflineQueue();
  }
  const sb = document.getElementById('sidebar');
  if (sb && window.innerWidth <= 768) sb.classList.add('collapsed');
});
</script>
