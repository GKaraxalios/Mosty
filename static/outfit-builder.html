<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outfit Builder — Mosty</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/mosty-theme.css">
<style>
:root{ --r:10px; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--text);text-decoration:underline;text-decoration-color:rgba(0,0,0,.25)}
a:hover{text-decoration-color:rgba(0,0,0,.5)}
.app{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
header h1{font-size:1.25rem;font-weight:700}
header .sub{font-size:12px;color:var(--muted);width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.btn{
  border:1px solid var(--border);background:var(--elev);color:var(--text);
  padding:8px 14px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;
}
.btn:hover{border-color:rgba(0,0,0,.22);background:var(--elev)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn:disabled{opacity:.45;pointer-events:none}
.readonly-banner{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);padding:10px 14px;border-radius:var(--r);font-size:13px;margin-bottom:14px;color:#fecaca}
.context{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.context label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.context select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;min-width:140px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.slot-btn{
  padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);
  font-size:12px;cursor:pointer;color:var(--muted);
}
.slot-btn.active{border-color:var(--accent);color:var(--text);background:rgba(0,0,0,.06)}
.slot-btn.filled{border-color:rgba(52,211,153,.35);color:#a7f3d0}
.grid-main{display:grid;grid-template-columns:1fr 320px;gap:16px}
@media(max-width:900px){.grid-main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;min-height:200px}
.panel h2{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.search-row{display:flex;gap:8px;margin-bottom:10px}
.search-row input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;transition:border-color .2s ease,box-shadow .2s ease}
.search-row input:focus{outline:none;border-color:rgba(0,0,0,.35);box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pcard{
  border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;
  background:var(--elev);transition:transform .15s ease,border-color .15s;
}
.pcard:hover{border-color:rgba(0,0,0,.2);transform:translateY(-2px);box-shadow:var(--shadow)}
.pcard img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#E5E5E5}
.pcard .meta{padding:8px;font-size:11px}
.pcard .name{font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .price{color:var(--muted);margin-top:4px}
.preview{display:flex;flex-direction:column;gap:10px}
.pv-item{display:flex;gap:10px;align-items:center;background:var(--elev);border-radius:10px;padding:8px;border:1px solid var(--border)}
.pv-item img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#E5E5E5}
.pv-item .info{flex:1;min-width:0;font-size:12px}
.pv-item .info .n{font-weight:600}
.pv-item .rm{font-size:11px;color:var(--err);cursor:pointer;margin-left:8px}
.sug{margin-top:10px;font-size:12px;color:var(--muted)}
.sug li{margin:6px 0 6px 18px}
.warnings{color:var(--text-muted);font-size:12px;margin-top:8px}
.score{font-size:13px;color:var(--muted);margin-top:8px;font-weight:500}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--elev);border:1px solid var(--border);padding:10px 20px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
.loading{opacity:.5;pointer-events:none}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>
<script>
const INJECTED_API_KEY = '__MOSTY_API_KEY__';
const API_V1_PREFIX = __API_V1_PREFIX__;

const SLOT_ORDER = ['top','bottom','shoes','outerwear','accessory'];

function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

function apiPrefix() {
  if (typeof API_V1_PREFIX === 'string' && API_V1_PREFIX.startsWith('/')) return API_V1_PREFIX;
  return '/api/v1';
}

async function bootstrap() {
  const origin = location.origin;
  const url = origin + apiPrefix() + '/outfit-builder/bootstrap';
  const r = await fetch(url);
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    throw new Error('bootstrap HTTP ' + r.status + (t ? ': ' + t.slice(0, 120) : ''));
  }
  return r.json();
}

async function loadSchema() {
  const p = apiPrefix();
  const candidates = [
    '/static/schemas/outfit-builder.production.json',
    location.origin + p + '/outfit-builder/ui-config?variant=production',
  ];
  let lastErr = null;
  for (const u of candidates) {
    try {
      const r = await fetch(u);
      if (!r.ok) {
        lastErr = new Error('schema HTTP ' + r.status + ' ' + u);
        continue;
      }
      return await r.json();
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('schema load failed');
}

class OutfitBuilderApp {
  constructor(schema, env) {
    this.schema = schema;
    this.env = env;
    this.apiKey = '';
    this.slots = { top:null,bottom:null,shoes:null,outerwear:null,accessory:null };
    this.context = { occasion:'', season:'', style_family:'', language:'el' };
    this.activeSlot = 'top';
    this.grid = [];
    this.suggestions = [];
    this.warnings = [];
    this.score = null;
    this.queryOverride = '';
    this.history = [];
    this.histPtr = -1;
    this.readonly = false;
    this.shareToken = null;
  }

  get endpoints() {
    let base = '';
    if (this.env && this.env.apiBaseUrl) {
      base = String(this.env.apiBaseUrl).replace(/\/+$/, '');
    }
    if (!base) {
      base = location.origin + apiPrefix();
    }
    return {
      search: base + '/outfit-builder/search-slot',
      suggestions: base + '/outfit-builder/suggestions',
      randomize: base + '/outfit-builder/randomize',
      save: base + '/outfit-builder/outfits',
      share: (t) => base + '/outfit-builder/share/' + encodeURIComponent(t),
    };
  }

  loadKey() {
    try {
      const k = localStorage.getItem('mosty_api_key');
      if (k) this.apiKey = k;
    } catch (_) {}
    if (INJECTED_API_KEY && !INJECTED_API_KEY.startsWith('__')) {
      this.apiKey = INJECTED_API_KEY;
      try { localStorage.setItem('mosty_api_key', this.apiKey); } catch (_) {}
    }
  }

  pushHistory() {
    const snap = JSON.stringify({ slots: this.slots, context: this.context });
    if (this.history[this.histPtr] === snap) return;
    this.history = this.history.slice(0, this.histPtr + 1);
    this.history.push(snap);
    if (this.history.length > 40) this.history.shift();
    this.histPtr = this.history.length - 1;
  }

  undo() {
    if (this.histPtr <= 0) return;
    this.histPtr--;
    const o = JSON.parse(this.history[this.histPtr]);
    this.slots = o.slots;
    this.context = o.context;
    this.render();
    this.fetchSlot();
  }

  redo() {
    if (this.histPtr >= this.history.length - 1) return;
    this.histPtr++;
    const o = JSON.parse(this.history[this.histPtr]);
    this.slots = o.slots;
    this.context = o.context;
    this.render();
    this.fetchSlot();
  }

  async api(url, opts) {
    const h = { 'Content-Type': 'application/json' };
    if (this.apiKey) h['x-mosty-api-key'] = this.apiKey;
    const r = await fetch(url, { ...opts, headers: { ...h, ...opts.headers } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error?.message || j.detail || 'HTTP ' + r.status);
    return j;
  }

  excludeSkus() {
    return Object.values(this.slots).filter(Boolean).map((p) => p.sku);
  }

  buildSlotsPayload() {
    const o = {};
    SLOT_ORDER.forEach((k) => { o[k] = this.slots[k]; });
    return o;
  }

  async fetchSlot() {
    if (this.readonly) return;
    if (!this.apiKey) { this.grid = []; this.render(); return; }
    const q = document.getElementById('qOverride');
    this.queryOverride = q ? q.value.trim() : '';
    const body = {
      slot: this.activeSlot,
      context: {
        occasion: this.context.occasion || null,
        season: this.context.season || null,
        style_family: this.context.style_family || null,
        language: this.context.language || null,
      },
      query_override: this.queryOverride || null,
      exclude_skus: this.excludeSkus(),
      top_k: 12,
    };
    const root = document.getElementById('app');
    root.classList.add('loading');
    try {
      const data = await this.api(this.endpoints.search, { method: 'POST', body: JSON.stringify(body) });
      this.grid = data.results || [];
    } catch (e) {
      this.toast(e.message || 'Search failed');
      this.grid = [];
    }
    root.classList.remove('loading');
    this.render();
  }

  async refreshSuggestions() {
    if (!this.apiKey || this.readonly) return;
    const body = { slots: this.buildSlotsPayload(), context: bodyContext(this.context) };
    try {
      const data = await this.api(this.endpoints.suggestions, { method: 'POST', body: JSON.stringify(body) });
      this.suggestions = data.suggestions || [];
      this.warnings = data.mismatch_warnings || [];
      this.score = data.compatibility_score;
    } catch (e) {
      this.toast(e.message);
    }
    this.render();
  }

  async randomize() {
    if (!this.apiKey || this.readonly) return;
    const body = { slots: this.buildSlotsPayload(), context: bodyContext(this.context) };
    try {
      const data = await this.api(this.endpoints.randomize, { method: 'POST', body: JSON.stringify(body) });
      this.slots = { top:null,bottom:null,shoes:null,outerwear:null,accessory:null };
      SLOT_ORDER.forEach((k) => { this.slots[k] = (data.slots && data.slots[k]) ? data.slots[k] : null; });
      this.pushHistory();
      this.suggestions = data.suggestions || [];
      this.warnings = data.mismatch_warnings || [];
      this.score = data.compatibility_score;
    } catch (e) {
      this.toast(e.message);
    }
    this.render();
    this.fetchSlot();
  }

  pick(p) {
    this.pushHistory();
    this.slots[this.activeSlot] = { sku: p.sku, name: p.name, url: p.url, image: p.image, price: p.price, currency: p.currency || 'EUR', score: p.score };
    this.refreshSuggestions();
    this.render();
    this.fetchSlot();
  }

  clearSlot(k) {
    this.pushHistory();
    this.slots[k] = null;
    this.refreshSuggestions();
    this.render();
    this.fetchSlot();
  }

  reset() {
    this.pushHistory();
    SLOT_ORDER.forEach((k) => { this.slots[k] = null; });
    this.render();
    this.fetchSlot();
    this.refreshSuggestions();
  }

  async save() {
    if (!this.apiKey || this.readonly) return;
    const title = (document.getElementById('outfitTitle') && document.getElementById('outfitTitle').value) || 'My outfit';
    const body = { title, slots: this.buildSlotsPayload(), context: bodyContext(this.context) };
    try {
      const data = await this.api(this.endpoints.save, { method: 'POST', body: JSON.stringify(body) });
      this.toast(data.share_url ? 'Αποθηκεύτηκε — σύνδεσμος αντιγράφηκε' : 'Αποθηκεύτηκε');
      if (data.share_url) {
        try { await navigator.clipboard.writeText(data.share_url); } catch (_) {}
      }
    } catch (e) {
      this.toast(e.message);
    }
  }

  async loadShare(token) {
    try {
      const r = await fetch(this.endpoints.share(token));
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || data.error?.message || 'Not found');
      this.slots = { top:null,bottom:null,shoes:null,outerwear:null,accessory:null };
      SLOT_ORDER.forEach((k) => { this.slots[k] = data.slots && data.slots[k] ? data.slots[k] : null; });
      this.context = {
        occasion: data.context?.occasion || '',
        season: data.context?.season || '',
        style_family: data.context?.style_family || '',
        language: data.context?.language || 'el',
      };
      this.readonly = true;
      this.shareToken = token;
      this.history = [];
      this.histPtr = -1;
      this.pushHistory();
    } catch (e) {
      this.toast(e.message || 'Load failed');
    }
    this.render();
  }

  toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  render() {
    const s = this.schema;
    const strings = (s.strings) || {};
    const title = (s.page && s.page.title) || 'Outfit Builder';
    const sub = (s.page && s.page.subtitle) || '';
    const slotLabels = {};
    (s.slots || []).forEach((x) => { slotLabels[x.id] = x.label; });

    const ctxOcc = (s.context && s.context.occasions) || [];
    const ctxSe = (s.context && s.context.seasons) || [];
    const ctxSt = (s.context && s.context.styles) || [];

    let html = '';
    if (this.readonly) {
      html += '<div class="readonly-banner">Προβολή διαμοιρασμένου outfit — προσθέστε API key στο <code>/chat</code> (Settings) για πλήρη επεξεργασία.</div>';
    }

    html += `<header><h1>${esc(title)}</h1><span class="sub">${esc(sub)}</span>
      <div class="actions">
        <a class="btn" href="/chat">${esc(strings.openChat || 'Chat')}</a>
        <button type="button" class="btn" id="btnUndo">${esc(strings.undo || 'Undo')}</button>
        <button type="button" class="btn" id="btnRedo">${esc(strings.redo || 'Redo')}</button>
        <button type="button" class="btn" id="btnReset">${esc(strings.reset || 'Reset')}</button>
        <button type="button" class="btn btn-primary" id="btnRand" ${this.readonly||!this.apiKey?'disabled':''}>${esc(strings.randomize || 'Random')}</button>
        <button type="button" class="btn btn-primary" id="btnSave" ${this.readonly||!this.apiKey?'disabled':''}>${esc(strings.save || 'Save')}</button>
      </div></header>`;

    html += `<div class="context">
      <div><label>Περίσταση</label><select id="occ">${ctxOcc.map((o) => `<option value="${esc(o.value)}" ${this.context.occasion===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>
      <div><label>Εποχή</label><select id="sea">${ctxSe.map((o) => `<option value="${esc(o.value)}" ${this.context.season===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>
      <div><label>Στυλ</label><select id="sty">${ctxSt.map((o) => `<option value="${esc(o.value)}" ${this.context.style_family===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>
      <div><label>Τίτλος αποθήκευσης</label><input id="outfitTitle" type="text" placeholder="My outfit" style="min-width:180px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text)" ${this.readonly?'disabled':''} /></div>
    </div>`;

    html += '<div class="slots">';
    SLOT_ORDER.forEach((id) => {
      const filled = this.slots[id] ? ' filled' : '';
      const act = this.activeSlot === id ? ' active' : '';
      html += `<button type="button" class="slot-btn${act}${filled}" data-slot="${id}">${esc(slotLabels[id] || id)}</button>`;
    });
    html += '</div>';

    html += '<div class="grid-main"><div class="panel"><h2>Catalog</h2>';
    if (!this.apiKey && !this.readonly) {
      html += '<p class="empty">Προσθέστε API key (από το Chat → Settings) για αναζήτηση προϊόντων.</p>';
    } else {
      html += `<div class="search-row"><input type="search" id="qOverride" placeholder="${esc(strings.searchPlaceholder||'')}" ${this.readonly?'disabled':''} /><button type="button" class="btn" id="btnSearch" ${this.readonly?'disabled':''}>OK</button></div>`;
      html += '<div class="prod-grid">';
      if (!this.grid.length) html += '<p class="empty">Δεν βρέθηκαν αποτελέσματα.</p>';
      this.grid.forEach((p) => {
        const img = p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy"/>` : '<div style="aspect-ratio:3/4;background:#E5E5E5"></div>';
        const price = p.price != null ? `€${Number(p.price).toFixed(2)}` : '';
        html += `<article class="pcard" data-sku="${esc(p.sku)}">${img}<div class="meta"><div class="name">${esc(p.name)}</div><div class="price">${esc(price)}</div></div></article>`;
      });
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="panel"><h2>Preview</h2><div class="preview">';
    let hasAny = false;
    SLOT_ORDER.forEach((id) => {
      const p = this.slots[id];
      if (!p) return;
      hasAny = true;
      const img = p.image ? `<img src="${esc(p.image)}" alt="">` : '<div style="width:56px;height:56px;background:#E5E5E5;border-radius:8px"></div>';
      html += `<div class="pv-item">${img}<div class="info"><div class="n">${esc(slotLabels[id] || id)}</div><div>${esc(p.name)}</div></div>
        <span class="rm" data-clear="${id}" ${this.readonly?'style="display:none"':''}>✕</span></div>`;
    });
    if (!hasAny) html += '<p class="empty">Διάλεξε κομμάτια από το grid.</p>';
    if (this.score != null) html += `<div class="score">${esc(strings.compatibility || 'Συμβατότητα')}: ${(this.score * 100).toFixed(0)}%</div>`;
    if (this.warnings.length) html += `<div class="warnings">${this.warnings.map((w) => esc(w)).join('<br>')}</div>`;
    html += `<button type="button" class="btn" id="btnSug" style="margin-top:10px" ${this.readonly||!this.apiKey?'disabled':''}>${esc(strings.refreshSuggestions || 'Refresh')}</button>`;
    html += '<div class="sug"><strong>' + esc(strings.suggestions || 'Suggestions') + '</strong><ul>';
    this.suggestions.forEach((s) => {
      html += `<li>${esc(s.message)}</li>`;
    });
    if (!this.suggestions.length) html += '<li>—</li>';
    html += '</ul></div></div></div></div>';

    document.getElementById('app').innerHTML = html;

    document.querySelectorAll('.slot-btn').forEach((b) => {
      b.addEventListener('click', () => {
        this.activeSlot = b.dataset.slot;
        this.render();
        this.fetchSlot();
      });
    });
    document.querySelectorAll('.pcard').forEach((el) => {
      el.addEventListener('click', () => {
        const sku = el.dataset.sku;
        const p = this.grid.find((x) => x.sku === sku);
        if (p) this.pick(p);
      });
    });
    document.querySelectorAll('.rm').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        this.clearSlot(el.dataset.clear);
      });
    });
    const bindCtx = (id, key) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', () => {
        this.context[key] = el.value;
        this.fetchSlot();
        this.refreshSuggestions();
      });
    };
    bindCtx('occ', 'occasion');
    bindCtx('sea', 'season');
    bindCtx('sty', 'style_family');

    document.getElementById('btnSearch') && document.getElementById('btnSearch').addEventListener('click', () => this.fetchSlot());
    document.getElementById('qOverride') && document.getElementById('qOverride').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') this.fetchSlot();
    });
    document.getElementById('btnUndo').addEventListener('click', () => this.undo());
    document.getElementById('btnRedo').addEventListener('click', () => this.redo());
    document.getElementById('btnReset').addEventListener('click', () => this.reset());
    document.getElementById('btnRand').addEventListener('click', () => this.randomize());
    document.getElementById('btnSave').addEventListener('click', () => this.save());
    document.getElementById('btnSug').addEventListener('click', () => this.refreshSuggestions());
  }
}

function bodyContext(c) {
  return {
    occasion: c.occasion || null,
    season: c.season || null,
    style_family: c.style_family || null,
    language: c.language || null,
  };
}

async function main() {
  const [boot, schema] = await Promise.all([bootstrap(), loadSchema()]);
  const app = new OutfitBuilderApp(schema, boot.env);
  app.loadKey();
  const params = new URLSearchParams(location.search);
  const share = params.get('share');
  if (share) {
    await app.loadShare(share);
  } else {
    app.pushHistory();
    app.render();
    app.fetchSlot();
    app.refreshSuggestions();
  }
}

main().catch((e) => {
  console.error(e);
  const msg = (e && e.message) ? String(e.message) : String(e);
  document.getElementById('app').innerHTML =
    '<div style="padding:24px;max-width:560px;margin:0 auto;color:#f87171;font-size:14px;line-height:1.5">' +
    '<strong>Failed to load Outfit Builder.</strong><br><br>' +
    esc(msg) +
    '<br><br><span style="color:#9898ab;font-size:12px">Check that the API exposes GET ' +
    esc(apiPrefix() + '/outfit-builder/bootstrap') +
    ' and restart the server after updating the code.</span></div>';
});
</script>
</body>
</html>
